[workspace]
members = [
    "crates/inla_fmesher",
    "crates/inla_math",
    "crates/inla_stats",
    "crates/inla_core",
    "crates/inla_sys",
    "py-inla",
    "r-inla",
]
resolver = "2"

[workspace.lints.clippy]
# Dense index loops are clearer than forced iterators in linear-algebra kernels.
needless_range_loop = "allow"
# FFI / inference entry points carry many parameters by design.
too_many_arguments = "allow"
type_complexity = "allow"
