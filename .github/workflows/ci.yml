name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Test & Lint the Rust Core
  rust-ci:
    name: Rust Core (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Mathematical Suite (cargo test)
        run: cargo test --workspace --all-features --verbose

  # Job 2: Cross-Platform Build Validation (PyO3 + Maturin)
  python-bindings-check:
    name: PyO3 Build Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Build Python Bindings
        # Compile py-inla in dev mode to make sure FFI layers link properly
        run: uvx maturin develop
        working-directory: ./py-inla
