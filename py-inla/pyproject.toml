[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "inla"
requires-python = ">=3.13"
version = "0.1.0"
description = "Fast approximate Bayesian inference using INLA, written in Rust"
license = "Apache-2.0"
urls = { Repository = "https://github.com/tenderking/rust-inla" }
dependencies = ["numpy>=2.5", "scipy>=1.16"]

[project.optional-dependencies]
dev = ["pytest>=9.1", "pandas>=3.0", "ruff>=0.12", "pyright>=1.1"]

[tool.maturin]
python-source = "python"
module-name = "inla._native"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["python"]
pythonVersion = "3.13"
extraPaths = ["python"]
typeCheckingMode = "standard"
