[package]
name = "py-inla"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/tenderking/rust-inla"
edition = "2024"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
inla_core = { path = "../crates/inla_core", features = ["sparse-ldlt"] }
pyo3 = { version = "0.29.2", features = ["abi3-py313", "extension-module"] }

[lints]
workspace = true
