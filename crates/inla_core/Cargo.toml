[package]
name = "inla_core"
version = "0.1.0"
edition = "2024"
description = "Facade re-exporting inla_fmesher + inla_math + inla_stats (legacy monolith API)"

[lib]
crate-type = ["rlib"]

[features]
default = []
gmrflib-ffi = ["inla_stats/gmrflib-ffi"]

[dependencies]
inla_fmesher = { path = "../inla_fmesher" }
inla_math = { path = "../inla_math" }
inla_stats = { path = "../inla_stats" }
