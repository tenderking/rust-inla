[package]
name = "inla_core"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/tenderking/rust-inla"
edition = "2024"
description = "Facade re-exporting inla_fmesher + inla_math + inla_stats (legacy monolith API)"

[lib]
crate-type = ["rlib"]

[features]
default = ["sparse-ldlt"]
sparse-ldlt = ["inla_math/sparse-ldlt", "inla_stats/sparse-ldlt"]
gmrflib-ffi = ["inla_stats/gmrflib-ffi"]

[dependencies]
inla_fmesher = { path = "../inla_fmesher" }
inla_math = { path = "../inla_math", features = ["sparse-ldlt"] }
inla_stats = { path = "../inla_stats", features = ["sparse-ldlt"] }

[lints]
workspace = true
